[package]
name = "app"
version = "0.1.2"
description = "Unofficial desktop control for Sennheiser headphones (GAIA over Bluetooth Classic RFCOMM): noise control, EQ and profiles."
authors = ["Stefan Meyer"]
license = "MIT"
repository = "https://github.com/stefanfmeyer/smart-connect-bt-audio"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Foundation",
  "Networking",
  "Networking_Sockets",
  "Networking_Connectivity",
  "Storage",
  "Storage_Streams",
] }
